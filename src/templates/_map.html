{# Leaflet map. Expects a JS array `MAP_POINTS` of {lat, lon, label} and a div with id `map`. #}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var el = document.getElementById('map');
  if (!el || typeof L === 'undefined') { if (el) el.innerHTML = '<p class="muted" style="padding:12px">Map needs an internet connection.</p>'; return; }
  var map = L.map('map', { scrollWheelZoom: false }).setView([10, 30], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 12, attribution: '&copy; OpenStreetMap' }).addTo(map);
  var pts = (window.MAP_POINTS || []);
  var group = [];
  pts.forEach(function (p) {
    var m = L.circleMarker([p.lat, p.lon], { radius: p.r || 8, color: p.color || '#c2410c', weight: 2, fillOpacity: .55 })
      .bindPopup(p.label).addTo(map);
    group.push([p.lat, p.lon]);
  });
  if (group.length === 1) map.setView(group[0], 6);
  else if (group.length > 1) map.fitBounds(group, { padding: [30, 30], maxZoom: 6 });
})();
</script>
